name: Build and Push

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify
        run: make verify
      - name: Check formatting
        run: git diff --exit-code
      - name: Run race tests
        run: make test-race

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: secret-protector:ci
      - name: Smoke test image
        run: |
          docker run --rm secret-protector:ci --help
          docker run --rm secret-protector:ci config init
